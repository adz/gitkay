name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore GitKay.slnx

      - name: Build
        run: dotnet build GitKay.slnx --configuration Release --no-restore --nologo -v minimal -m:1

      - name: Test
        run: dotnet test tests/GitKay.Tests/GitKay.Tests.fsproj --configuration Release --no-build --nologo -v minimal

      - name: UI tests
        run: dotnet test tests/GitKay.UI.Tests/GitKay.UI.Tests.fsproj --configuration Release --no-build --nologo -v minimal

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Unit tests run on the JIT; the self-test runs the NativeAOT binary over paths that only fail there.
      - name: NativeAOT self-test
        run: |
          bash scripts/publish-gitkay.sh --rid linux-x64 --output artifacts/publish/linux-x64
          artifacts/publish/linux-x64/gitkay --self-test
