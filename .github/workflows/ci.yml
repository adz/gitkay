name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GitKay.slnx

      - name: Build
        run: dotnet build GitKay.slnx --configuration Release --no-restore --nologo -v minimal -m:1

      - name: Test
        run: dotnet test tests/GitKay.Tests/GitKay.Tests.fsproj --configuration Release --no-build --nologo -v minimal
