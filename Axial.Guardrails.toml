version = 2

[default]
role = "domain"

# Raw I/O boundaries. FolderSource is the synchronous filesystem boundary for folder comparison and preview;
# SelfTestBridge is the blocking process-entry-point bridge.
# Host is the desktop host boundary: live services, the Elmish runtime's start and stop, launch flags, and the update
# instrumentation for crash reports.
[files]
capabilities = [
  "src/GitKay.Core/FolderSource.fs",
  "src/GitKay.Core/SelfTestBridge.fs",
]
host = [
  "src/GitKay.Core/Host.fs",
]

# Exact exceptional files that legitimately perform one-off ambient effects at a host or live-service boundary.
[boundaries]
files = [
  "src/GitKay.Core/App.fs",
  "src/GitKay.Core/CmdDiagnostics.fs",
  "src/GitKay.Core/GitService.fs",
  "src/GitKay.Core/Git/Internal/RepositoryDiscovery.fs",
]
