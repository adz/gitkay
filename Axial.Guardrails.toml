version = 2

[default]
role = "domain"

# The test projects run under the test role: effects are allowed for setup and assertions.
[projects]
test = ["tests/**/*.fsproj"]

# Raw I/O boundaries. FolderSource is the synchronous filesystem boundary for folder comparison and preview;
# Processors reads the processor count that sizes the worker pools; SelfTestBridge is the blocking
# process-entry-point bridge.
# Host is the desktop host boundary: live services, the Elmish runtime's start and stop, launch flags, the update
# instrumentation for crash reports, and the external launches; Stores is the settings and UI state files' host side.
[files]
capabilities = [
  "src/GitKay.Core/FolderSource.fs",
  "src/GitKay.Core/Processors.fs",
  "src/GitKay.Core/SelfTestBridge.fs",
  "src/GitKay.Serialization/BackgroundWriter.fs",
]
host = [
  "src/GitKay.Core/Host.fs",
  "src/GitKay.Serialization/Stores.fs",
]

# Exact exceptional files that legitimately perform one-off ambient effects at a host or live-service boundary.
[boundaries]
files = [
  "src/GitKay.Core/CmdDiagnostics.fs",
  "src/GitKay.Core/Git/Internal/RepositoryDiscovery.fs",
]
